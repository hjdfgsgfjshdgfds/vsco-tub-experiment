<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VSCO Social Matches</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Social Matches</h1>
      <p id="summary">Loading...</p>
    </div>
    <button id="refresh" type="button" title="Refresh">Refresh</button>
  </header>

  <div class="toolbar">
    <input id="filter" type="search" placeholder="Filter username, handle, description">
    <button id="open-feed" type="button">Feed</button>
    <button id="copy" type="button">Copy</button>
    <button id="export" type="button">TXT</button>
    <button id="clear" type="button">Clear</button>
  </div>

  <main id="matches"></main>
  <div id="empty" hidden>No matches saved yet.</div>

  <script src="popup.js"></script>
</body>
</html>

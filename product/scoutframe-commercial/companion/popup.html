<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoutframe Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="mark"><span></span><span></span><span></span></div>
    <p class="eyebrow">Scoutframe Companion</p>
    <h1>Search stays in Chrome.</h1>
    <p>This extension makes read-only VSCO search requests in your current profile. It never copies cookies or credentials into the local app.</p>
    <div id="status" class="status"><span></span><b>Checking VSCO session…</b></div>
    <button id="open-app" type="button">Open Scoutframe</button>
    <a href="https://vsco.co/" target="_blank" rel="noreferrer">Open VSCO sign-in</a>
    <small>Independent software. Not affiliated with VSCO.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
